<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgNightMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b33"/>
      <stop offset="45%" stop-color="#0f1123"/>
      <stop offset="100%" stop-color="#060812"/>
    </linearGradient>

    <linearGradient id="mikazukiGoldMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5cf"/>
      <stop offset="25%" stop-color="#f6d375"/>
      <stop offset="60%" stop-color="#d9a536"/>
      <stop offset="100%" stop-color="#ba821c"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed for Android Safe Zone Masking -->
  <rect width="512" height="512" fill="url(#bgNightMask)"/>

  <!-- Scaled slightly inside safe zone (80% box) -->
  <g transform="translate(51.2, 38) scale(0.8)">
    <!-- Outer Crescent -->
    <path d="M 148 404 
             C 72 328, 72 178, 168 98 
             C 220 54, 292 54, 344 98 
             C 440 178, 440 328, 364 404 
             C 416 332, 416 196, 332 126 
             C 288 90, 224 90, 180 126 
             C 96 196, 96 332, 148 404 Z" 
          fill="url(#mikazukiGoldMask)"/>

    <!-- Inner Crescent -->
    <path d="M 180 376 
             C 124 316, 124 200, 196 142 
             C 232 112, 280 112, 316 142 
             C 388 200, 388 316, 332 376 
             C 368 318, 368 214, 308 166 
             C 278 142, 234 142, 204 166 
             C 144 214, 144 318, 180 376 Z" 
          fill="url(#mikazukiGoldMask)"/>

    <!-- Bottom Dot -->
    <circle cx="256" cy="412" r="14" fill="url(#mikazukiGoldMask)"/>
    <circle cx="256" cy="412" r="6" fill="#fff9e6" opacity="0.85"/>
  </g>

  <!-- Title Bottom -->
  <text x="256" y="476" font-family="'Noto Serif SC', 'Songti SC', serif" font-size="19" font-weight="600" fill="url(#mikazukiGoldMask)" text-anchor="middle" letter-spacing="7" opacity="0.9">本丸手札</text>
</svg>
